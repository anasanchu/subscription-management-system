<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUBSCRIPT · Operations</title><style>
:root{--ink:#17223b;--muted:#768198;--nav:#111a31;--paper:#f4f6fa;--line:#e5e9f0;--violet:#6654d9;--mint:#d9f3e9;--green:#17794e;--amber:#fff0d6;--red:#a33a42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:238px;background:var(--nav);color:#bdc5d4;padding:25px 15px;display:flex;flex-direction:column;flex-shrink:0}.brand{font:800 19px Manrope;color:white;letter-spacing:.08em;padding:3px 13px 30px}.brand b{color:#9d92ff}.cap{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#7e89a1;padding:17px 13px 8px}.nav{border:0;background:transparent;color:#b9c3d7;text-align:left;padding:11px 13px;border-radius:9px;margin:2px 0}.nav:hover,.nav.sel{background:#242f4a;color:white}.nav.sel{box-shadow:inset 3px 0 #9185ff}.sidefoot{margin-top:auto;border-top:1px solid #2a3550;padding:18px 10px 0;color:#8f9bb1;font-size:12px}.main{flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:2}.crumb{font:700 15px Manrope}.right{display:flex;gap:13px;align-items:center}.search{border:1px solid var(--line);padding:10px 13px;border-radius:9px;width:230px}.avatar{background:#eceaff;color:#5546bd;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font-weight:700}.content{padding:28px 34px;max-width:1600px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}h1{font:700 25px Manrope;margin:6px 0 4px}.sub{color:var(--muted);margin:0 0 25px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.metric-label{color:var(--muted);font-size:12px}.metric{font:700 24px Manrope;margin-top:10px}.metric-sub{color:var(--muted);font-size:11px;margin-top:5px}.columns{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;min-width:0}.panel h3{font:700 14px Manrope;margin:0 0 16px}.btn{border:0;background:var(--violet);color:white;border-radius:8px;padding:10px 14px;font-weight:600}.btn:hover{filter:brightness(.94)}.btn.alt{background:#f0efff;color:#5546bd}.btn.line{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#a33a42}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#818ba0;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:11px 10px;border-bottom:1px solid var(--line)}.table td{padding:13px 10px;border-bottom:1px solid #eff1f5;font-size:12px}.table tr:last-child td{border-bottom:0}.status{display:inline-block;border-radius:20px;padding:5px 8px;background:#f0f2f6;color:#59657a;font-size:10px;font-weight:700}.status.Active,.status.Paid,.status.Confirmed,.status.Recorded{background:var(--mint);color:var(--green)}.status.Overdue,.status.Cancelled,.status.Closed{background:#fdebed;color:var(--red)}.status.Unpaid,.status.Quotation,.status.Paused{background:var(--amber);color:#97630e}.small{font-size:11px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;background:#f1f2fa}.loginbox{background:white;border:1px solid var(--line);border-radius:18px;padding:34px;width:min(440px,92vw);box-shadow:0 22px 70px #121c3412}.loginbox h1{margin:6px 0}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:11px;color:#647087;font-weight:700}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:white}.modalbg{position:fixed;inset:0;background:#10172b70;display:grid;place-items:center;z-index:5;padding:16px}.modal{background:white;padding:23px;border-radius:14px;width:min(520px,96vw);max-height:90vh;overflow:auto}.modal h2{font:700 18px Manrope;margin:0 0 15px}.actions{display:flex;gap:7px}.chart{height:160px;display:flex;align-items:end;gap:12px;padding:12px 4px 0;border-bottom:1px solid var(--line)}.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px}.bar{width:70%;border-radius:6px 6px 0 0;background:linear-gradient(#968af4,#6654d9);min-height:3px}.barlabel{font-size:10px;color:var(--muted)}.toast{position:fixed;right:22px;bottom:20px;background:#18233d;color:white;border-radius:9px;padding:12px 17px;z-index:9;box-shadow:0 8px 30px #0002}.empty{color:var(--muted);padding:20px;text-align:center}.mobile{display:none}@media(max-width:950px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.content{padding:23px 20px}.top{padding:0 20px}}@media(max-width:650px){.side{width:60px;padding:16px 6px}.brand{font-size:0;padding:10px 12px 24px}.brand:first-letter{font-size:20px}.cap{display:none}.nav{font-size:0;text-align:center;padding:12px 4px}.nav:first-letter{font-size:17px}.sidefoot{font-size:0;padding:10px 0}.top{padding:0 12px}.search{width:135px}.content{padding:18px 12px}.grid{gap:9px}.card{padding:14px}.metric{font-size:19px}.hide-mobile{display:none}}
</style><link rel=stylesheet href=/public/design.css></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0);let user=null,section='Overview',cache={};
async function api(path,opts={}){let r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function toast(s){let x=document.createElement('div');x.className='toast';x.setAttribute('role','status');x.setAttribute('aria-live','polite');x.textContent=s;document.body.append(x);setTimeout(()=>x.remove(),2800)}
function loginPage(){$('#app').innerHTML=`<div class="login"><div class="loginbox"><div class="brand" style="color:#17223b;padding:0 0 16px">SUBSCRIPT<b>·</b></div><div class="eyebrow">Subscription operations platform</div><h1>Good business starts here.</h1><p class="sub">Sign in to manage the recurring revenue engine.</p><form id="login"><div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required value="admin@subscript.demo"></div><div class="field"><label>PASSWORD</label><input name="password" type="password" required value="AdminDemo!2026"></div><button class="btn" style="width:100%;margin-top:8px">Sign in</button></form><p class="small" style="margin-top:18px">Demo: admin@subscript.demo / AdminDemo!2026</p><p class="small">Customer: mia@example.demo / CustomerDemo!2026</p><button class="btn alt" style="width:100%" onclick="registerPage()">Create customer account</button></div></div>`;$('#login').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{await api('/login',{method:'POST',body:JSON.stringify(f)});await boot()}catch(x){toast(x.message)}}}
function registerPage(){$('#app').innerHTML=`<div class="login"><div class="loginbox"><div class="brand" style="color:#17223b;padding:0 0 16px">SUBSCRIPT<b>·</b></div><div class="eyebrow">Customer registration</div><h1>Create your account.</h1><p class="sub">Your private space for subscriptions and billing.</p><form id="register"><div class="field"><label>FULL NAME</label><input name="name" required></div><div class="field"><label>EMAIL ADDRESS</label><input name="email" type="email" required></div><div class="field"><label>PASSWORD · 9+ CHARACTERS, UPPERCASE, LOWERCASE AND SYMBOL</label><input name="password" type="password" required></div><button class="btn" style="width:100%;margin-top:8px">Create account</button></form><button class="btn line" style="width:100%;margin-top:10px" onclick="loginPage()">Back to sign in</button></div></div>`;$('#register').onsubmit=async e=>{e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Account created. Sign in to continue.');loginPage()}catch(x){toast(x.message)}}}
const navItems=[['Start here','Overview','◫'],['','Customers','◉'],['','Products','▦'],['','Plans','◇'],['Billing','Subscriptions','↻'],['','Quotes','▤'],['','Invoices','▧'],['','Payments','⇄'],['Settings','Offers','%'],['','Tax rates','∑']];
function shell(){let customer=user.role==='CUSTOMER';let items=customer?[['Portal','Overview','◫'],['','Subscriptions','↻'],['','Invoices','▧'],['','Payments','⇄'],['','Offers','%']]:navItems.filter(x=>user.role==='ADMIN'||!['Offers','Tax rates'].includes(x[1]));$('#app').innerHTML=`<div class="shell"><aside class="side"><div class="brand">SUBSCRIPT<b>·</b></div>${items.map(([g,n,i],ix)=>`${g?`<div class="cap">${g}</div>`:''}<button class="nav ${n===section?'sel':''}" onclick="go('${n}')">${n}</button>`).join('')}<div class="sidefoot">Local demo workspace<br>Persistent SQLite storage</div></aside><main class="main"><header class="top"><div class="crumb">${section}</div><div class="right"><input class="search hide-mobile" placeholder="Search records…" onkeydown="if(event.key==='Enter')searchAll(this.value)"><div class="avatar">${user.name.split(' ').map(s=>s[0]).slice(0,2).join('')}</div><span class="hide-mobile">${user.name}</span><button class="btn line" onclick="signout()">Sign out</button></div></header><div class="content" id="view"></div></main></div>`;render()}
async function go(s){section=s;shell()}async function signout(){await api('/logout',{method:'POST'});user=null;loginPage()}
async function render(){try{if(section==='Overview')return await overview();await listView(section)}catch(e){$('#view').innerHTML=`<div class="panel">${e.message}</div>`}}
/* A simpler overview: one headline number, everyday labels, and the next useful action. */
async function overview(){
  let d=await api('/dashboard');
  if(d.customer){
    const active=d.subscriptions.filter(x=>x.status==='Active').length;
    const open=d.invoices.filter(x=>!['Paid','Cancelled'].includes(x.status)).reduce((a,x)=>a+Number(x.total||0),0);
    $('#view').innerHTML=`<div class="welcome-row"><div><div class="eyebrow">YOUR SUBSCRIPT ACCOUNT</div><h1>Welcome back, ${esc(user.name.split(' ')[0])}.</h1><p class="sub">Your plans, upcoming bills and payment history in one place.</p></div></div><div class="quick-stats"><div class="stat-card"><span>Plans in progress</span><strong>${active}</strong><small>Subscriptions currently active</small></div><div class="stat-card"><span>Open invoices</span><strong>${money(open)}</strong><small>Payable amount on unpaid invoices</small></div></div><div class="simple-columns"><section class="panel"><h3>Your subscriptions</h3><p class="panel-help">Pause, resume, or close a plan when its terms allow it.</p>${table(d.subscriptions,[['plan','Plan'],['status','Status'],['next_bill','Next bill']],true)}</section><section class="panel"><h3>Your invoices</h3><p class="panel-help">Open an invoice to print or save it.</p>${table(d.invoices,[['number','Invoice'],['total','Amount'],['status','Status']])}</section><section class="panel"><h3>Recent payments</h3>${table(d.payments,[['ref','Reference'],['amount','Amount'],['method','Method'],['paid_at','Date']])}</section></div>`;return;
  }
  const first=user.name.split(' ')[0],renewals=d.renewals||[];
  $('#view').innerHTML=`<div class="welcome-row"><div><div class="eyebrow">YOUR BUSINESS · ${new Date().toLocaleDateString()}</div><h1>Welcome back, ${esc(first)}.</h1><p class="sub">Here’s what’s happening with your customers and subscriptions.</p></div><button class="btn" onclick="go('Quotes')">Create a quotation <span aria-hidden="true">→</span></button></div><section class="revenue-lead"><div class="lead-main"><div class="eyebrow">MONTHLY RECURRING REVENUE <span class="info-dot" title="Estimated monthly value of all active subscriptions">i</span></div><div class="lead-number">${money(d.mrr)}</div><p>Expected monthly income from active subscriptions.</p></div><div class="lead-rule"></div><div class="lead-side"><span>Annual estimate</span><strong>${money(d.arr)}</strong><small>Monthly recurring revenue × 12</small></div></section><div class="quick-stats"><div class="stat-card"><span>Customers</span><strong>${d.customers}</strong><small>People with an account</small></div><div class="stat-card"><span>Active subscriptions</span><strong>${d.active}</strong><small>Plans running now</small></div><div class="stat-card"><span>Money collected</span><strong>${money(d.collected)}</strong><small>Payments recorded to date</small></div></div><div class="simple-columns"><section class="panel trend-panel"><div class="panel-head"><div><h3>Invoices over time</h3><p class="panel-help">Amounts billed each month. This is separate from money collected.</p></div><button class="text-button" onclick="go('Invoices')">See invoices →</button></div>${chart(d.trend)}</section><section class="panel attention-panel"><div class="panel-head"><div><h3>Needs your attention</h3><p class="panel-help">Follow up on these items to keep accounts healthy.</p></div></div><button class="attention-link" onclick="go('Invoices')"><span class="attention-mark">!</span><span><b>${d.overdue} overdue invoices</b><small>Past their payment due date</small></span><span class="attention-arrow">→</span></button><button class="attention-link" onclick="go('Invoices')"><span class="attention-mark calm">₹</span><span><b>${money(d.outstanding)} unpaid</b><small>Balance across open invoices</small></span><span class="attention-arrow">→</span></button></section><section class="panel"><div class="panel-head"><div><h3>Coming up next</h3><p class="panel-help">Subscriptions with a bill due soon.</p></div><button class="text-button" onclick="go('Subscriptions')">All subscriptions →</button></div>${table(renewals.slice(0,5),[['customer','Customer'],['plan','Plan'],['next_bill','Bill date']])}</section><section class="panel"><div class="panel-head"><div><h3>Latest invoices</h3><p class="panel-help">The newest bills created in your account.</p></div><button class="text-button" onclick="go('Invoices')">All invoices →</button></div>${table((d.invoices||[]).slice(0,5),[['number','Invoice'],['customer','Customer'],['total','Amount'],['status','Status']])}</section></div>`;
}
function chart(a){if(!a.length)return '<div class="empty">Invoices will appear here after you process billing.</div>';let max=Math.max(...a.map(x=>x.invoiced),1);return `<div class="chart">${[...a].reverse().map(x=>`<div class="barcol"><span class="small">${money(x.invoiced)}</span><div class="bar" style="height:${Math.max(4,x.invoiced/max*75)}%"></div><span class="barlabel">${x.month}</span></div>`).join('')}</div>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function table(items,cols,acts=false){if(!items?.length)return '<div class="empty">Nothing to show yet.</div>';return `<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}${acts?'<th>Actions</th>':''}</tr></thead><tbody>${items.map(r=>`<tr>${cols.map(c=>`<td>${c[0]==='total'||c[0]==='amount'?money(r[c[0]]):c[0]==='status'?`<span class="status ${esc(r[c[0]])}">${esc(r[c[0]])}</span>`:esc(r[c[0]])}</td>`).join('')}${acts?`<td><div class="actions">${r.status==='Active'?`<button class="btn alt" onclick="subAction(${r.id},'pause')">Pause</button><button class="btn line" onclick="subAction(${r.id},'close')">Close</button>`:r.status==='Paused'?`<button class="btn alt" onclick="subAction(${r.id},'resume')">Resume</button>`:`<button class="btn alt" onclick="subAction(${r.id},'renew')">Renew</button>`}</div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
const schemas={Customers:[['name','Customer name'],['email','Email'],['password','Temporary password']],Products:[['name','Product name'],['kind','Product type'],['price','Base price (INR)'],['cost','Cost (INR)'],['description','Description'],['variant','Variant (optional, e.g. Odoo)'],['extra','Variant price add-on']],Plans:[['name','Plan name'],['product_id','Product'],['price','Price (INR)'],['frequency','Frequency'],['min_qty','Minimum quantity'],['starts','Available from (YYYY-MM-DD)'],['ends','Available until']],Subscriptions:[['customer_id','Customer'],['plan_id','Plan'],['quantity','Quantity'],['start_date','Start date (YYYY-MM-DD)']],Quotes:[['customer_id','Customer'],['plan_id','Plan'],['quantity','Quantity'],['valid_days','Validity in days']],Offers:[['name','Discount name'],['kind','Type'],['amount','Amount / percent'],['min_total','Minimum purchase'],['min_qty','Minimum quantity'],['starts','Starts (YYYY-MM-DD)'],['ends','Expires (YYYY-MM-DD)'],['max_uses','Usage limit']],'Tax rates':[['name','Tax name'],['rate','Rate %']]};
const cols={Customers:[['name','Name'],['email','Email'],['created_at','Added']],Products:[['name','Product'],['kind','Type'],['price','Price'],['variants','Variants']],Plans:[['name','Plan'],['product','Product'],['price','Price'],['frequency','Billing']],Subscriptions:[['ref','Reference'],['customer','Customer'],['plan','Plan'],['status','Status'],['next_bill','Next bill']],Quotes:[['ref','Quotation'],['customer','Customer'],['plan','Plan'],['total','Total'],['status','Status'],['valid_until','Valid until']],Invoices:[['number','Invoice'],['customer','Customer'],['issued','Issued'],['due','Due'],['total','Total'],['status','Status']],Payments:[['ref','Payment'],['customer','Customer'],['invoice','Invoice'],['amount','Amount'],['method','Method'],['paid_at','Paid']],Offers:[['name','Name'],['kind','Type'],['amount','Value'],['uses','Used'],['ends','Expires']],'Tax rates':[['name','Tax'],['rate','Rate %']]};let entities={Customers:'customers',Products:'products',Plans:'plans',Subscriptions:'subscriptions',Quotes:'quotes',Invoices:'invoices',Payments:'payments',Offers:'discounts','Tax rates':'taxes'};
async function listView(s,q=''){let ent=entities[s],data=await api('/'+ent+'?q='+encodeURIComponent(q));cache[s]=data.items;let heading={Customers:'Customer accounts',Products:'Product catalogue',Plans:'Billing plans',Subscriptions:'Subscription lifecycle',Quotes:'Sales quotations',Invoices:'Invoice register',Payments:'Payment ledger',Offers:'Discount rules','Tax rates':'Tax rules'}[s];let add=['Customers','Products','Plans','Subscriptions','Quotes','Offers','Tax rates'].includes(s)&&user.role!=='CUSTOMER';let extra=s==='Invoices'&&user.role!=='CUSTOMER'?'<button class="btn alt" onclick="runBilling()">Process due billing</button>':'';$('#view').innerHTML=`<div class="row"><div><div class="eyebrow">OPERATIONS</div><h1>${heading}</h1><p class="sub">Search and manage your ${s.toLowerCase()} records.</p></div><div class="actions">${extra}${add?`<button class="btn" onclick="formModal('${s}')">+ Add ${s==='Customers'?'customer':s.slice(0,-1)}</button>`:''}</div></div><div class="panel">${table(data.items,cols[s]||[],s==='Subscriptions'&&user.role==='CUSTOMER')}${s==='Invoices'?`<p class="small">Select a row’s invoice number to print, or use row controls.</p>`:''}</div>`;if(s==='Invoices')document.querySelectorAll('.table tbody tr').forEach((tr,i)=>{let r=data.items[i];tr.children[0].innerHTML=`<a href="/api/invoices/${r.id}/print" target="_blank">${esc(r.number)}</a>`;if(user.role!=='CUSTOMER'){tr.children[tr.children.length-1].innerHTML=`<button class="btn alt" onclick="recordPay(${r.id},${r.total})">Record payment</button>`}});if(s==='Quotes')document.querySelectorAll('.table tbody tr').forEach((tr,i)=>{let r=data.items[i];if(r.status==='Quotation')tr.children[tr.children.length-1]?.insertAdjacentHTML('beforeend',` <button class="btn alt" onclick="confirmQuote(${r.id})">Confirm</button>`)})}
async function searchAll(q){if(['Customers','Products','Plans','Subscriptions','Invoices'].includes(section))listView(section,q);else go('Customers')}
async function formModal(s){let schema=schemas[s],html=`<div class="modalbg" onclick="if(event.target===this)this.remove()"><div class="modal"><div class="row"><h2>Add ${s.slice(0,-1)}</h2><button class="btn line" onclick="this.closest('.modalbg').remove()">✕</button></div><form id="create">`;for(let [key,label] of schema){if(key==='product_id'||key==='customer_id'||key==='plan_id'){let kind=key==='product_id'?'Products':key==='customer_id'?'Customers':'Plans',items=cache[kind]|| (await api('/'+entities[kind])).items;html+=`<div class="field"><label>${label}</label><select name="${key}" required>${items.map(x=>`<option value="${x.id}">${esc(x.name||x.ref)}${x.email?' · '+esc(x.email):''}</option>`).join('')}</select></div>`}else if(key==='frequency'||key==='kind'){let opts=key==='frequency'?['daily','weekly','monthly','yearly']:s==='Offers'?['percent','fixed']:['Software','Service','Integration'];html+=`<div class="field"><label>${label}</label><select name="${key}">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`}else html+=`<div class="field"><label>${label}</label><input name="${key}" ${['price','cost','extra','min_qty','quantity','amount','min_total','max_uses','valid_days','rate'].includes(key)?'type="number" step="any"':''} ${['name','email','price'].includes(key)?'required':''}></div>`}html+=`<button class="btn" style="width:100%">Save record</button></form></div></div>`;document.body.insertAdjacentHTML('beforeend',html);$('#create').onsubmit=async e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));for(let k of ['price','cost','extra','min_qty','quantity','amount','min_total','max_uses','valid_days','rate','product_id','customer_id','plan_id'])if(p[k]!==undefined&&p[k]!=='')p[k]=Number(p[k]);if(s==='Products'&&p.variant){p.variants=[{attribute:'Brand',value:p.variant,extra:p.extra||0}];delete p.variant;delete p.extra}try{await api('/'+entities[s],{method:'POST',body:JSON.stringify(p)});document.querySelector('.modalbg').remove();toast('Saved successfully');render()}catch(x){toast(x.message)}}}
async function subAction(id,action){try{await api(`/subscriptions/${id}/${action}`,{method:'POST'});toast('Subscription updated');render()}catch(e){toast(e.message)}}async function confirmQuote(id){try{await api(`/quotes/${id}/confirm`,{method:'POST'});toast('Quotation confirmed and subscription activated');render()}catch(e){toast(e.message)}}async function runBilling(){try{let d=await api('/billing/process',{method:'POST'});toast(`Billing run complete · ${d.created} invoices created`);render()}catch(e){toast(e.message)}}async function recordPay(id,total){let amount=prompt('Payment amount (INR)',total);if(amount===null)return;let method=prompt('Payment method: Cash, Bank transfer, Card, Online', 'Bank transfer');try{await api(`/invoices/${id}/pay`,{method:'POST',body:JSON.stringify({amount:Number(amount),method,simulation:false})});toast('Payment recorded');render()}catch(e){toast(e.message)}}
async function boot(){let r=await fetch('/api/me');if(!r.ok){loginPage();return}user=(await r.json()).user;section='Overview';shell()}boot();
</script></body></html>
